<script type="text/python" id="__pwe_Vec2">
import math
from browser import document, window, aio


class Vec2:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def norm(self):
        return math.sqrt(self.x**2 + self.y**2)
    
    def normalize(self):
        n = self.norm()
        if n != 0:
            return Vec2(self.x/n, self.y/n)
        raise ZeroDivisionError("vector has length zero")

    def rot90(self):
        return Vec2(self.y, -self.x)
    
    def rot270(self):
        vec = self
        for i in range(0, 2):
            vec = vec.rot90()

    def dot(self, v):
        return self.x*v.x+self.y*v.y
            
    def __repr__(self):
        return f"Vec2({self.x}, {self.y})"

    def __eq__(self, vec):
        return self.x == vec.x and self.y == vec.y
            
    def __add__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x + vec.x, self.y + vec.y)
        return Vec2(self.x + vec, self.y + vec)
    
    def __radd__(self, n):
        return Vec2(self.x + n, self.y + n)
    
    def __sub__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x - vec.x, self.y - vec.y)
        return Vec2(self.x - vec, self.y - vec)
    
    def __mul__(self, n):
        if isinstance(n, Vec2):
            raise ValueError("no vector to vector multiplication")
        return Vec2(self.x*n, self.y*n)
    
    def __rmul__(self, n):
        return self*n
    
    def __truediv__(self, n):
        return Vec2(self.x/n, self.y/n)
    
    def __getitem__(self, idx):
        vec = [self.x, self.y]
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        return vec[idx]
    
    def __setitem__(self, idx, val):
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        if idx == -2:
            self.x = val
        elif idx == -1:
            self.y = val
        elif idx == 0:
            self.x = val
        elif idx == 1:
            self.y = val


            

</script>

<script type="text/python" id="__pwe_Mouse">
class Mouse:
    def __init__(self, canvas):
        self.canvas = canvas
        self.ldown = False
        self.rdown = False
        self.pos = [0, 0]
        self.canvas.bind("mousedown", self.onmousedown)
        self.canvas.bind("mouseup", self.onmouseup)
        self.canvas.bind("mousemove", self.onmousemove)
    
    def onmousedown(self, event):
        if event.button == 0:
            self.ldown = True
        elif event.button == 1:
            self.rdown = True
        self.getpos(event)
        
    def onmouseup(self, event):
        if event.button == 0:
            self.ldown = False
        elif event.button == 1:
            self.rdown = False
        self.getpos(event)
        
    def onmousemove(self, event):
        self.getpos(event)
     
    def getpos(self, event):
        rect = self.canvas.getBoundingClientRect()
        self.pos[0] = event.clientX - rect.left
        self.pos[1] = event.clientY - rect.top
</script>

<script type="text/python" id="__pwe_drawing">
import math
from browser import console

class Drawing:
    def __init__(self, CTX):
        self.CTX = CTX

        
    def circle(self, x, y, radius, color='black', filled=False, width=1):
        "Draw a circle at (x,y) with given radius"
        self.CTX.beginPath()
        self.CTX.arc(x, y, radius, 0, math.pi * 2)
        if (filled):
            self.CTX.fillStyle = color
            self.CTX.fill()
        else:
            self.CTX.strokeStyle = color
            self.CTX.lineWidth = width
            self.CTX.stroke()


    def gradient_dot(self, x, y, inner_rad, outer_rad, colors=['#000f', '#0000'], radii=[0, 1]):
        gradient = self.CTX.createRadialGradient(x, y, inner_rad, x, y, outer_rad)
        for i, color in enumerate(colors):
            gradient.addColorStop(radii[i], color)
        
        self.CTX.beginPath()
        self.CTX.arc(x, y, outer_rad, 0, math.pi*2)
        self.CTX.fillStyle = gradient
        self.CTX.fill()
        
        
    def rect(self, x, y, width, height, color):
        self.CTX.fillStyle = color
        self.CTX.fillRect(
            round(x),
            round(y),
            round(width),
            round(height)) 
    

    def line(self, x1, y1, x2, y2, color='black', width=1):
        "Draw a line from (x1,y1) to (x2,y2)"
        self.CTX.strokeStyle = color
        self.CTX.lineWidth = width
        self.CTX.beginPath()
        self.CTX.moveTo(x1, y1)
        self.CTX.lineTo(x2, y2)
        self.CTX.stroke()


    def text(self, text, x, y, color='black', font_size=12, font_family='Arial', 
              centered=True, bold=False):
        "Draw text at (x,y)"
        self.CTX.fillStyle = color
        self.CTX.font = f'{"bold" if bold else ""} {font_size}px {font_family}'
        if centered: 
            self.CTX.textAlign = 'center'
            self.CTX.textBaseline = 'middle'
        else:
            self.CTX.textAlign = 'left'
            self.CTX.textBaseline = 'alphabetic'
        self.CTX.fillText(text, x, y)
