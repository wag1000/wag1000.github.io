            document.body.insertBefore(self.errdiv, document.body.firstChild)
        self.errdiv.textContent += ("\n" + msg)

import math
from browser import document, window, aio


class Vec2:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def norm(self):
        return math.sqrt(self.x**2 + self.y**2)
    
    def normalize(self):
        n = self.norm()
        if n != 0:
            return Vec2(self.x/n, self.y/n)
        raise ZeroDivisionError("vector has length zero")

    def rot90(self):
        return Vec2(self.y, -self.x)
    
    def rot270(self):
        vec = self
        for i in range(0, 2):
            vec = vec.rot90()
            
    def __repr__(self):
        return f"Vec2({self.x}, {self.y})"

    def __eq__(self, vec):
        return self.x == vec.x and self.y == vec.y
            
    def __add__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x + vec.x, self.y + vec.y)
        return Vec2(self.x + vec, self.y + vec)
    
    def __radd__(self, n):
        return Vec2(self.x + n, self.y + n)
    
    def __sub__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x - vec.x, self.y - vec.y)
        return Vec2(self.x - vec, self.y - vec)
    
    def __mul__(self, n):
        if isinstance(n, Vec2):
            raise ValueError("no vector to vector multiplication")
        return Vec2(self.x*n, self.y*n)
    
    def __rmul__(self, n):
        return self*n
    
    def __truediv__(self, n):
        return Vec2(self.x/n, self.y/n)
    
    def __getitem__(self, idx):
        vec = [self.x, self.y]
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        return vec[idx]
    
    def __setitem__(self, idx, val):
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        if idx == -2:
            self.x = val
        elif idx == -1:
            self.y = val
        elif idx == 0:
            self.x = val
        elif idx == 1:
            self.y = val

class Mouse:
    def __init__(self, canvas):
        self.canvas = canvas
        self.ldown = False
        self.rdown = False
        self.pos = [0, 0]
        self.canvas.bind("mousedown", self.onmousedown)
        self.canvas.bind("mouseup", self.onmouseup)
        self.canvas.bind("mousemove", self.onmousemove)
    
    def onmousedown(self, event):
        if event.button == 0:
            self.ldown = True
        elif event.button == 1:
            self.rdown = True
        self.getpos(event)
        
    def onmouseup(self, event):
        if event.button == 0:
            self.ldown = False
        elif event.button == 1:
            self.rdown = False
        self.getpos(event)
        
    def onmousemove(self, event):
        self.getpos(event)
     
    def getpos(self, event):
        rect = self.canvas.getBoundingClientRect()
        self.pos[0] = event.clientX - rect.left
        self.pos[1] = event.clientY - rect.top

import math
from browser import console

class Drawing:
    def __init__(self, CTX):
        self.CTX = CTX

        
    def draw_circle(self, x, y, radius, color='black', filled=False, width=1):
        "Draw a circle at (x,y) with given radius"
        self.CTX.beginPath()
        self.CTX.arc(x, y, radius, 0, math.pi * 2)
        if (filled):
            self.CTX.fillStyle = color
            self.CTX.fill()
        else:
            self.CTX.strokeStyle = color
            self.CTX.lineWidth = width
            self.CTX.stroke()
        
        
    def drawRectangle(self, x, y, width, height, color):
        self.CTX.fillStyle = color
        self.CTX.fillRect(
            round(x),
            round(y),
            round(width),
            round(height)) 

    def draw_text(self, text, x, y, color='black', font_size=12, font_family='Arial', 
              centered=True, bold=False):
        "Draw text at (x,y)"
        self.CTX.fillStyle = color
        self.CTX.font = f'{"bold" if bold else ""} {font_size}px {font_family}'
        if centered: 
            self.CTX.textAlign = 'center'
            self.CTX.textBaseline = 'middle'
        else:
            self.CTX.textAlign = 'left'
            self.CTX.textBaseline = 'alphabetic'
        self.CTX.fillText(text, x, y)
    

    def draw_line(self, x1, y1, x2, y2, color='black', width=1):
        "Draw a line from (x1,y1) to (x2,y2)"
        self.CTX.strokeStyle = color
        console.log(width)
        self.CTX.lineWidth = width
        self.CTX.beginPath()
        self.CTX.moveTo(x1, y1)
        self.CTX.lineTo(x2, y2)
        self.CTX.stroke()

class Bucket:
    """Class that defaults to False on attribute access.
    Otherwise allows easy assignment and clearing of all attributes.
    """
    def __init__(self):
        self._mydata = dict()

    def __getattr__(self, attr):
        return self._mydata.get(attr, False)

    def __setattr__(self, name, value):
        # Special handling for our internal _mydata dictionary
        if name == '_mydata':
            super().__setattr__(name, value)
        else:
            self._mydata[name] = value

    def clear(self):
        self._mydata.clear()

def draw_rect(p1, p2, length, colour = "black"):
    draw.draw_line((p1 + (p2 - p1)/2).x, (p1 + (p2 - p1)/2).y, ((p1 + (p2 - p1)/2) - ((p2 - p1).normalize()*length/2).rot90()).x, ((p1 + (p2 - p1)/2) - ((p2 - p1).normalize()*length/2).rot90()).y, colour, width = (p2 - p1).norm()/2)
    draw.draw_line((p1 + (p2 - p1)/2).x, (p1 + (p2 - p1)/2).y, ((p1 + (p2 - p1)/2) + ((p2 - p1).normalize()*length/2).rot90()).x, ((p1 + (p2 - p1)/2) + ((p2 - p1).normalize()*length/2).rot90()).y, colour, width = (p2 - p1).norm()/2)
def l_rpos(center, rad, width):
    diff = Vec2(math.cos(rad-0.5*math.pi)*width/2, math.sin(rad-0.5*math.pi)*width/2)
    return center + diff, center - diff
lpos, rpos = l_rpos(center, rad, width)
deaths = 0
justdied = False
deathpos = None
score = 0
basetime = 0
time_s = 0
def init():
    global center, rad, rotvel, xel, vel, lpos, rpos, planetpos, planetv, planetxel, planetm, radii, shots, shotpos, shotvel, shotlife, t, dead, start, score, basetime, time_s, turretpos, tv
    if justdied:
        deathpos = center
    center = Vec2(400, 600)
    #length = 100
    #width = 10
    rad = 1.5*math.pi
    rotvel = 0
    #mass = 0.01
    #g = 5
    xel = Vec2(0, 0)
    vel = Vec2(0, 0)
    #stars = [Vec2(random.randint(0, WD), random.randint(0, HT)) for i in range(50)]
    # draw_rect(Vec2(200, 600), Vec2(500, 700), 500, "green")
    lpos, rpos = l_rpos(center, rad, width)
    planetpos = [Vec2(800, 600), Vec2(1000, 600)]
    planetv = [Vec2(0, 0), Vec2(0, -1.5)]
    planetxel = [Vec2(0, 0) for i in planetpos]
    planetm = [100, 20]
    radii = [20, 10]
    #turretpos = Vec2(2000, 600)
    shots = 1
    shotpos = []
    shotvel = []
    shotlife = []
    t = 0
    dead = False
    start = False
    score = 0
    basetime = time.perf_counter()
    time_s = 0
    turretpos = Vec2(2000, 600)
    tv = Vec2(random.uniform(-2, 2), random.uniform(-2, 2)).normalize()*3
#draw.draw_line(lpos.x, lpos.y, rpos.x, rpos.y)
@bind(document, "keydown")
def keyDownHandler(e):
    global keyboard,ready
    if e.key.isalpha():
        setattr(keyboard, e.key, True)
@bind(document, "keyup")
def keyUpHandler(e):
    global keyboard
    if e.key.isalpha():
        setattr(keyboard, e.key, False)

@bind(document, "keypress")
def keyUpHandler(e):
    global keyboard, start, dead
    if e.key == " ":
        start = False
        dead = False
        init()

def draw_stuff():
    draw.drawRectangle(0, 0, WD, HT, "#000")
    for starpos in stars:
        draw.draw_circle(starpos.x, starpos.y, 1, color = "white")
    for i, pos in enumerate(planetpos):
        draw.draw_circle(pos.x, pos.y, radii[i], filled = True, color = "blue")
    draw.draw_line(lpos.x, lpos.y, rpos.x, rpos.y, color = "white")
    front = center + (lpos - center).rot90()*5
    draw.draw_line(front.x, front.y, lpos.x, lpos.y, color = "white")
    draw.draw_line(front.x, front.y, rpos.x, rpos.y, color = "white")
    draw.draw_circle(turretpos.x, turretpos.y, 10, filled = True, color = "#aaa")
    if justdied and t < 60:
        rad_ = 50
        draw.draw_circle(deathpos.x, deathpos.y, rad_, filled = True, color = "#f30")
        rad_ = 30
        draw.draw_circle(deathpos.x, deathpos.y, rad_, filled = True, color = "#f70")
        rad_ = 20
        draw.draw_circle(deathpos.x, deathpos.y, rad_, filled = True, color = "#fa0")
        rad_ = 10
        draw.draw_circle(deathpos.x, deathpos.y, rad_, filled = True, color = "#fe0")
    for pos in shotpos:
        draw.draw_circle(pos.x, pos.y, 3, filled = True, color = "red")
    if keyboard.w:
        back = center + (center-front).normalize()*20
        draw.draw_line(center.x, center.y, back.x, back.y, width = 2, color = "#f50")
        back = (back-center) * 3/4 + center
        draw.draw_line(center.x, center.y, back.x, back.y, width = 3, color = "#f70")
        back = (back-center) * 2/3 + center
        draw.draw_line(center.x, center.y, back.x, back.y, width = 4, color = "#fa0")
        # back += (rpos-center)
        # draw.draw_line(center.x, center.y, back.x, back.y, width = 2, color = "#230")
        # back -= 2*(rpos-center)
        # draw.draw_line(center.x, center.y, back.x, back.y, width = 2, color = "#230")
        # back += (rpos-center)
        back = (back-center) * 7/10 + center
        draw.draw_line(center.x, center.y, back.x, back.y, width = 4, color = "#fc0")
        back = (back-center) * 4/7 + center
        draw.draw_line(center.x, center.y, back.x, back.y, width = 4, color = "#fe0")
    if keyboard.a:
        side = front + (lpos-center).normalize()*4
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fa0")
        side = (side-front) * 1/2 + front
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fc0")
        side = (side-front) * 1/2 + front
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fe0")
    if keyboard.d:
        side = front + (rpos-center).normalize()*4
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fa0")
        side = (side-front) * 1/2 + front
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fc0")
        side = (side-front) * 1/2 + front
        draw.draw_line(front.x, front.y, side.x, side.y, width = 2, color = "#fe0")
    if dead:
        draw.draw_text("YOU LOSE", WD/2, HT/2, "#fff", 450)
    draw.draw_text(f"Time Survived: {time_s:.2f} seconds", 200, 20, "#fff", 30)
    if start:
        draw.draw_text("Press Space to Start", WD/2, HT/2, "#fff", 200)
def shoot():
    global shotvel, shotpos, shotlife, score, tv
    for i in range(int(-shots/2+0.5), int(shots/2+0.5)):
        lead = (vel-tv)*(center-turretpos).norm()/15
        spread = (((center-turretpos).norm()-1000)/-1500)+1
        basevel = (Vec2((center+lead).x%WD, (center+lead).y%HT)-turretpos).normalize()*15
        newvel = ((basevel/3) + (basevel.rot90().normalize()/shots)*i*spread).normalize()*15+tv
        shotpos.append(turretpos)
        shotvel.append(newvel)
        shotlife.append(500)
        tv -= newvel/20
    score += 1

def touching_shots():
    global deaths, justdied, deathpos
    mid = center + (lpos-center).rot90()
    for i, apos in enumerate(shotpos):
        if (mid-(apos-shotvel[i]/2)).norm() <= 10 or (mid-apos).norm() <= 10:
            deaths += 1
            deathpos = center
            justdied = True
            return True
    return False
    


def update(a):
    global center, rad, xel, vel, lpos, rpos, planetpos, planetv, planetxel, rotvel, t, shotpos, shotvel, shotlife, dead, time_s, turretpos, tv
    if not start and not dead:
        time_s = time.perf_counter()-basetime
        rad += math.pi*rotvel
        planetxel = [Vec2(0, 0) for i in planetpos]
        xel = Vec2(0, 0)
        for i, pos in enumerate(planetpos):
            tv += ((pos-tv).normalize()*g*planetm[i])/((pos-tv).norm()**2)
            for k, posa in enumerate(planetpos):
                if i != k:
                    planetxel[i] += ((posa-pos).normalize()*g*planetm[k])/((posa-pos).norm()**2)#*planetm[i])
            planetxel[i] += ((center-pos).normalize()*g*mass)/((center-pos).norm()**2)#*planetm[i])
            if (pos-center).norm() > radii[i]:
                xel += ((pos-center).normalize()*g*planetm[i])/((pos-center).norm()**2)#*mass)
            planetv[i] += planetxel[i]
            planetpos[i] += planetv[i]
            planetpos[i] = Vec2(planetpos[i].x%WD, planetpos[i].y%HT)
            for k, posb in enumerate(shotpos):
                shotvel[k] += ((pos-posb).normalize()*g*planetm[i])/((pos-posb).norm()**2)
        for i, avel in enumerate(shotvel):
            shotlife[i] -= 1
            shotpos[i] += avel
            shotpos[i] = Vec2(shotpos[i].x%WD, shotpos[i].y%HT)
            if shotlife[i] == 0 or avel.norm() > 20:
                shotpos.pop(i)
                shotvel.pop(i)
                shotlife.pop(i)
        if t%5 == 0:
            shoot()
        if keyboard.w:
            xel += (lpos-center).rot90().normalize()*0.1
        if keyboard.a:
            rotvel -= 0.0005
            xel += (rpos-center).normalize()*0.01
        if keyboard.d:
            rotvel += 0.0005
            xel += (lpos-center).normalize()*0.01
        vel += xel
        center += vel
        center = Vec2(center.x%WD, center.y%HT)
        lpos, rpos = l_rpos(center, rad, width)
        turretpos += tv
        turretpos = Vec2(turretpos.x%WD, turretpos.y%HT)
    
        if touching_shots():
            dead = True
            #init()
            audio = window.Audio.new(window.SOUNDS['you_lose'])
            audio.play()
    
        draw_stuff()
        t += 1
    window.requestAnimationFrame(update)


draw_stuff()
update(0)
