import math
from browser import document, window, aio


class Vec2:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def norm(self):
        return math.sqrt(self.x**2 + self.y**2)
    
    def normalize(self):
        n = self.norm()
        if n != 0:
            return Vec2(self.x/n, self.y/n)
        raise ZeroDivisionError("vector has length zero")

    def rot90(self):
        return Vec2(self.y, -self.x)
    
    def rot270(self):
        vec = self
        for i in range(0, 2):
            vec = vec.rot90()
            
    def __repr__(self):
        return f"Vec2({self.x}, {self.y})"

    def __eq__(self, vec):
        return self.x == vec.x and self.y == vec.y
            
    def __add__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x + vec.x, self.y + vec.y)
        return Vec2(self.x + vec, self.y + vec)
    
    def __radd__(self, n):
        return Vec2(self.x + n, self.y + n)
    
    def __sub__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x - vec.x, self.y - vec.y)
        return Vec2(self.x - vec, self.y - vec)
    
    def __mul__(self, n):
        if isinstance(n, Vec2):
            raise ValueError("no vector to vector multiplication")
        return Vec2(self.x*n, self.y*n)
    
    def __rmul__(self, n):
        return self*n
    
    def __truediv__(self, n):
        return Vec2(self.x/n, self.y/n)
    
    def __getitem__(self, idx):
        vec = [self.x, self.y]
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        return vec[idx]
    
    def __setitem__(self, idx, val):
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        if idx == -2:
            self.x = val
        elif idx == -1:
            self.y = val
        elif idx == 0:
            self.x = val
        elif idx == 1:
            self.y = val

class Mouse:
    def __init__(self, canvas):
        self.canvas = canvas
        self.ldown = False
        self.rdown = False
        self.pos = [0, 0]
        self.canvas.bind("mousedown", self.onmousedown)
        self.canvas.bind("mouseup", self.onmouseup)
        self.canvas.bind("mousemove", self.onmousemove)
        self.scale = 1.0
    
    def onmousedown(self, event):
        if event.button == 0:
            self.ldown = True
        elif event.button == 1:
            self.rdown = True
        self.getpos(event)
        
    def onmouseup(self, event):
        if event.button == 0:
            self.ldown = False
        elif event.button == 1:
            self.rdown = False
        self.getpos(event)
        
    def onmousemove(self, event):
        self.getpos(event)
     
    def getpos(self, event):
        rect = self.canvas.getBoundingClientRect()
        self.pos[0] = (event.clientX - rect.left) / self.scale
        self.pos[1] = (event.clientY - rect.top) / self.scale

import math
from browser import console

class Drawing:
    def __init__(self, CTX):
        self.CTX = CTX

        
    def draw_circle(self, x, y, radius, color='black', filled=False, width=1):
        "Draw a circle at (x,y) with given radius"
        self.CTX.beginPath()
        self.CTX.arc(x, y, radius, 0, math.pi * 2)
        if (filled):
            self.CTX.fillStyle = color
            self.CTX.fill()
        else:
            self.CTX.strokeStyle = color
            self.CTX.lineWidth = width
            self.CTX.stroke()
        
        
    def drawRectangle(self, x, y, width, height, color):
        self.CTX.fillStyle = color
        self.CTX.fillRect(
            round(x),
            round(y),
            round(width),
            round(height)) 
    

    def draw_line(self, x1, y1, x2, y2, color='black', width=1):
        "Draw a line from (x1,y1) to (x2,y2)"
        self.CTX.strokeStyle = color
        self.CTX.lineWidth = width
        self.CTX.beginPath()
        self.CTX.moveTo(x1, y1)
        self.CTX.lineTo(x2, y2)
        self.CTX.stroke()

            self.CTX.textBaseline = 'middle'
        else:
            self.CTX.textAlign = 'left'
            self.CTX.textBaseline = 'alphabetic'
        self.CTX.fillText(text, x, y)

            self.draw_line(pos.x, pos.y, pos_2.x, pos_2.y, color, width)

<script type="text/python" id="pythoncode">
from Vec2 import Vec2
from Mouse import Mouse
from drawing import Drawing
import math
import random
from browser import document, window, aio, console, bind

canvas = document.getElementById("canvas")
CTX = document['canvas'].getContext('2d')
WD = document['canvas'].width
HT = document['canvas'].height

Draw = Drawing(CTX)
mouse = Mouse(canvas)
paddlelen = 100
speed = 20
ballpos = Vec2(WD/2, HT/2)
xvel = 0
while xvel < speed*0.8:
    xvel = random.uniform(0, speed)
ballvel = Vec2(xvel, random.uniform(-speed*0.8, speed*0.8))
paddleh = HT/2
aih = HT/2
score = 0
ended = False
highscore = 0
start = True

def reset():
    global ballpos, xvel, ballvel, paddleh, aih, score, ended, highscore
    #paddlelen = 100
    speed = 25
    ballpos = Vec2(WD/2, HT/2)
    xvel = 0
    while xvel < speed*0.8:
        xvel = random.uniform(0, speed)
    ballvel = Vec2(xvel, random.uniform(-speed*0.8, speed*0.8))
    paddleh = HT/2
    aih = HT/2
    #score = 0
    ended = False
    if score > highscore:
        highscore = score
    score = 0

def resizeCanvas(_):
    scale = min(
        window.innerWidth / (canvas.width),
        window.innerHeight / (canvas.height))
    #scale = math.floor(scale)
    canvas.style.width = f'{round(scale * canvas.width)}px'
    canvas.style.height = f'{round(scale * canvas.height)}px'
    mouse.scale = scale

def draw(ended, start):
    Draw.drawRectangle(0, 0, WD, HT, color = "#000")
    Draw.draw_line(0, paddleh + paddlelen/2, 0, paddleh-paddlelen/2, width = 20, color = "#f00")
    Draw.draw_line(WD, aih + paddlelen/2, WD, aih-paddlelen/2, width = 20, color = "#f00")
    Draw.draw_circle(ballpos[0], ballpos[1], 15, filled = True, color = "#aaf")
    Draw.draw_text(f"Score: {score}, Highscore = {highscore}", WD/2, 50, color = "#fff", font_size = 40)
    Draw.draw_text(f"Speed of ball: {ballvel.norm():.2f} pixels per tick.", 200, 15, color = "#fff", font_size = 25)
    if ended:
        Draw.draw_text("YOU LOSE", WD/2, HT/2, "#fff", 350)
        Draw.draw_text("Click to restart", WD/2, HT-30, "#fff", 15)

        Draw.draw_text("Start!", WD/2, HT/2, "#fff", 450)
        Draw.draw_text("Click to start", WD/2, HT-30, "#fff", 15)

def update(t):
    global ballpos, ballvel, paddleh, aih, score, ended, speed
    #ended = False
    if not (ended or start):
        wantedpos = aih
        try:
            if ballvel[0] > 0:
                wantedpos = (WD-ballpos[0])*ballvel[1]/ballvel[0]+ballpos[1]
        except ZeroDivisionError:
            wantedpos = aih
        while wantedpos > HT or wantedpos < 0:
            if wantedpos > HT:
                wantedpos = HT - (wantedpos-HT)
            else:
                wantedpos = -wantedpos
        if aih - wantedpos < -speed:
            changeval = speed
        elif aih - wantedpos > speed:
            changeval = -speed
        elif aih - wantedpos > -speed and aih - wantedpos < speed:
            changeval = wantedpos - aih
        aih += changeval
        if paddleh - mouse.pos[1] < -speed:
            changeval = speed
        elif paddleh - mouse.pos[1] > speed:
            changeval = -speed
        else:
            changeval = mouse.pos[1] - paddleh
        paddleh += changeval
        if ballpos[1] > HT or ballpos[1] < 0:
            ballvel[1] = -ballvel[1]
            audio = window.Audio.new(window.SOUNDS['blip'])
            audio.play()

            if abs(paddleh - ballpos[1]) <= paddlelen/2 + abs(ballvel[1]/ballvel[0])*abs(ballpos[0])+10:
                ballvel = Vec2(-ballvel[0], ballvel[1] + changeval/5)
                score += 1
                speed *= 1.05
                ballvel *= 1.05
                audio = window.Audio.new(window.SOUNDS['blip'])

                ballvel = Vec2(-ballvel[0], ballvel[1])
                audio = window.Audio.new(window.SOUNDS['blip'])
                audio.play()
            else:
                ended = True
        ballpos += ballvel
    draw(ended, start)
    window.requestAnimationFrame(update)

def on_mouseup(evt):
    global start
    if ended:
        reset()
    if start:
        start = not start

update(0)
