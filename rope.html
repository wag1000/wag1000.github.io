<script type="text/python" id="__pwe_Vec2">
import math
from browser import document, window, aio


class Vec2:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def norm(self):
        return math.sqrt(self.x**2 + self.y**2)
    
    def normalize(self):
        n = self.norm()
        if n != 0:
            return Vec2(self.x/n, self.y/n)
        raise ZeroDivisionError("vector has length zero")

    def dot(self, vect):
        return self.x*vect.x+self.y*vect.y

    def rot90(self):
        return Vec2(self.y, -self.x)

    def rot180(self):
        return Vec2(-self.x, -self.y)
    
    def rot270(self):
        vec = self
        for i in range(0, 2):
            vec = vec.rot90()
        return vec
            
    def __repr__(self):
        return f"Vec2({self.x}, {self.y})"

    def __eq__(self, vec):
        return self.x == vec.x and self.y == vec.y
            
    def __add__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x + vec.x, self.y + vec.y)
        return Vec2(self.x + vec, self.y + vec)
    
    def __radd__(self, n):
        return Vec2(self.x + n, self.y + n)
    
    def __sub__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x - vec.x, self.y - vec.y)
        return Vec2(self.x - vec, self.y - vec)
    
    def __mul__(self, n):
        if isinstance(n, Vec2):
            raise ValueError("no vector to vector multiplication")
        return Vec2(self.x*n, self.y*n)
    
    def __rmul__(self, n):
        return self*n
    
    def __truediv__(self, n):
        return Vec2(self.x/n, self.y/n)
    
    def __getitem__(self, idx):
        vec = [self.x, self.y]
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        return vec[idx]
    
    def __setitem__(self, idx, val):
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        if idx == -2:
            self.x = val
        elif idx == -1:
            self.y = val
        elif idx == 0:
            self.x = val
        elif idx == 1:
            self.y = val

<script type="text/python" id="__pwe_draw">
import math
from browser import console

class Drawing:
    def __init__(self, CTX):
        self.CTX = CTX

        
    def draw_circle(self, x, y, radius, color='black', filled=False, width=1):
        "Draw a circle at (x,y) with given radius"
        self.CTX.beginPath()
        self.CTX.arc(x, y, radius, 0, math.pi * 2)
        if (filled):
            self.CTX.fillStyle = color
            self.CTX.fill()
        else:
            self.CTX.strokeStyle = color
            self.CTX.lineWidth = width
            self.CTX.stroke()
        
        
    def drawRectangle(self, x, y, width, height, color):
        self.CTX.fillStyle = color
        self.CTX.fillRect(
            round(x),
            round(y),
            round(width),
            round(height)) 
    

    def draw_line(self, x1, y1, x2, y2, color='black', width=1):
        "Draw a line from (x1,y1) to (x2,y2)"
        self.CTX.strokeStyle = color
        self.CTX.lineWidth = width
        self.CTX.beginPath()
        self.CTX.moveTo(x1, y1)
        self.CTX.lineTo(x2, y2)
        self.CTX.stroke()

class Bucket:
    """Class that defaults to False on attribute access.
    Otherwise allows easy assignment and clearing of all attributes.
    """
    def __init__(self):
        self._mydata = dict()

    def __getattr__(self, attr):
        return self._mydata.get(attr, False)

    def __setattr__(self, name, value):
        # Special handling for our internal _mydata dictionary
        if name == '_mydata':
            super().__setattr__(name, value)
        else:
            self._mydata[name] = value

    def clear(self):
        self._mydata.clear()

class Joint:
    def __init__(self, m, linked, dist, vel: Vec2, pos: Vec2):
        self.linked_joint = linked
        self.dist = dist
        self.pos = pos
        self.vel = vel
        self.mass = m#*dist/2.5

    def applyforce(self, force):
        self.vel += force/self.mass

    def adjustpos(self):
        diff = (self.pos-self.linked_joint.pos).norm()-self.dist
        self.pos -= diff*((self.pos-self.linked_joint.pos).normalize())

    def update(self):
        self.applyforce(Vec2(0, 0.005)*self.mass)
        self.lvel = self.linked_joint.vel
        relvel = self.lvel-self.vel
        unwantvel = relvel.dot((self.linked_joint.pos-self.pos).normalize())*(self.linked_joint.pos-self.pos).normalize()
        newrelvel = relvel - unwantvel
        self.vel = self.lvel-newrelvel
        self.linked_joint.applyforce(unwantvel.rot180())
        #self.applyforce(unwantvel.rot90())
        self.vel *= 0.999
        self.pos += self.vel
        self.adjustpos()
        #assert round((self.linked_joint.pos-self.pos).norm()) == self.dist, f"Distance is wrong {(self.linked_joint.pos-self.pos).norm()}"
        #console.log(f"{self.vel}")

    def draw(self):
        Draw.draw_line(self.pos.x, self.pos.y, self.linked_joint.pos.x, self.linked_joint.pos.y, width = 3)
