<script type="text/python" id="__pwe_Vec2">
import math
from browser import document, window, aio


class Vec2:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def norm(self):
        return math.sqrt(self.x**2 + self.y**2)
    
    def normalize(self):
        n = self.norm()
        if n != 0:
            return Vec2(self.x/n, self.y/n)
        raise ZeroDivisionError("vector has length zero")

    def rot90(self):
        return Vec2(self.y, -self.x)
    
    def rot270(self):
        vec = self
        for i in range(0, 2):
            vec = vec.rot90()
            
    def __repr__(self):
        return f"Vec2({self.x}, {self.y})"

    def __eq__(self, vec):
        return self.x == vec.x and self.y == vec.y
            
    def __add__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x + vec.x, self.y + vec.y)
        return Vec2(self.x + vec, self.y + vec)
    
    def __radd__(self, n):
        return Vec2(self.x + n, self.y + n)
    
    def __sub__(self, vec):
        if isinstance(vec, Vec2):
            return Vec2(self.x - vec.x, self.y - vec.y)
        return Vec2(self.x - vec, self.y - vec)
    
    def __mul__(self, n):
        if isinstance(n, Vec2):
            raise ValueError("no vector to vector multiplication")
        return Vec2(self.x*n, self.y*n)
    
    def __rmul__(self, n):
        return self*n
    
    def __truediv__(self, n):
        return Vec2(self.x/n, self.y/n)
    
    def __getitem__(self, idx):
        vec = [self.x, self.y]
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        return vec[idx]
    
    def __setitem__(self, idx, val):
        if idx > 1 or idx < -2:
            raise IndexError("vector only has two dimensions")
        if idx == -2:
            self.x = val
        elif idx == -1:
            self.y = val
        elif idx == 0:
            self.x = val
        elif idx == 1:
            self.y = val

<script type="text/python" id="__pwe_drawing">
import math
from browser import console

class Drawing:
    def __init__(self, CTX):
        self.CTX = CTX

        
    def draw_circle(self, x, y, radius, color='black', filled=False, width=1):
        "Draw a circle at (x,y) with given radius"
        self.CTX.beginPath()
        self.CTX.arc(x, y, radius, 0, math.pi * 2)
        if (filled):
            self.CTX.fillStyle = color
            self.CTX.fill()
        else:
            self.CTX.strokeStyle = color
            self.CTX.lineWidth = width
            self.CTX.stroke()
        
        
    def drawRectangle(self, x, y, width, height, color):
        self.CTX.fillStyle = color
        self.CTX.fillRect(
            round(x),
            round(y),
            round(width),
            round(height)) 
    

    def draw_line(self, x1, y1, x2, y2, color='black', width=1):
        "Draw a line from (x1,y1) to (x2,y2)"
        self.CTX.strokeStyle = color
        self.CTX.lineWidth = width
        self.CTX.beginPath()
        self.CTX.moveTo(x1, y1)
        self.CTX.lineTo(x2, y2)
        self.CTX.stroke()
        
    def draw_spring(self, pos1, pos2, peaks, color = "black", width = 1, springwidth = 10):
        positions = []
        diff = pos2 - pos1
        for i in range(peaks+1):
            if i%2 == 0:
                pos = pos1 + ((diff/peaks)*i) + ((diff.normalize()*springwidth)).rot90()
            else:
                pos = pos1 + ((diff/peaks)*i) - ((diff.normalize()*springwidth)).rot90()
            positions.append(pos)
        for i in range(len(positions)-1):
            pos = positions[i]

class Slit:
    def __init__(self, pos, w = 8, am = 1):
        self.pos = pos
        self.w = w
        self.am = am

    def addinterference(self, pos, phase):
        d = (pos - self.pos).norm()+(phase%self.w)
        new_amp = self.am/(0.001*d+1)
        return new_amp*(math.sin(((d-d%self.w)/self.w)+1))

class Experiment:
    def __init__(self, slits, w = 2, am = 1, phase = 0):
        self.slits = slits
        self.slitlist = []
        self.phase = phase
        for i in range(1, slits+1):
            self.slitlist.append(Slit(Vec2(WD/2 + (i//2)*(i%2*2+1), HT), w, am))
        console.log('Made experiment')

    def draw(self):
        global imgdata
        t_start = time.perf_counter()
        for x in range(WD):
            #console.log(f"x={x}")
            for y in range(HT):
                #console.log(f"y={y}")
                brightness = 0
                for slit in self.slitlist:
                    brightness += slit.addinterference(Vec2(x, y), self.phase)
                brightness = (abs(brightness)/self.slits)*255
                imgdata.data[(x+y*WD)*4] = brightness
                imgdata.data[(x+y*WD)*4+1] = brightness
                imgdata.data[(x+y*WD)*4+2] = brightness
                imgdata.data[(x+y*WD)*4+3] = 255
                #Draw.drawRectangle(x, y, 1, 1, brightness)
                #console.log(f"Done with pixel {x}, {y}.")
        CTX.putImageData(imgdata, 0, 0)
        console.log(f"time = {(time.perf_counter()-t_start)*1000} milliseconds")
